<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>餐飲 SOP 與成本管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif;background:#f6f1e8;color:#251d1c}.shell{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);overflow:hidden;border-radius:26px;background:#fff;box-shadow:0 18px 50px #3b1c1c22;border:1px solid #e8dfd5}.hero{padding:28px;background:#5b1e23;color:#fff}.tag{font-size:11px;letter-spacing:.18em;color:#f5d79b;font-weight:700}.hero h1{font-size:30px;line-height:1.25;margin:9px 0}.hero p{margin:0;color:#fff0cf;font-size:14px}.form{padding:28px}.form label{display:block;font-size:14px;font-weight:650;margin:0 0 18px}.form input{width:100%;display:block;margin-top:7px;border:1px solid #d8d0c8;border-radius:12px;padding:13px;font-size:16px;background:#fff}.form input:focus{outline:2px solid #a74d4d;border-color:#a74d4d}.form button,.logout{width:100%;border:0;border-radius:12px;padding:14px;background:#5b1e23;color:#fff;font-weight:750;font-size:16px}.form button:disabled{opacity:.65}.error{display:none;background:#fff0f0;color:#a21c1c;padding:11px;border-radius:10px;font-size:14px;margin:-5px 0 16px}.dash{min-height:100vh;background:#f6f1e8}.hidden{display:none}header{background:#fff;border-bottom:1px solid #e8dfd5;padding:16px 20px}header h1{font-size:20px;margin:5px 0}.logout{width:auto;float:right;padding:8px 12px;font-size:14px}.content{max-width:720px;margin:auto;padding:20px}.welcome{border-radius:20px;background:#5b1e23;padding:22px;color:#fff}.welcome p{color:#fff0cf;margin:0}.welcome h2{margin:7px 0 0;font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.metric{background:#fff;border:1px solid #e8dfd5;border-radius:18px;text-align:center;padding:17px}.metric strong{display:block;font-size:25px;color:#5b1e23}.metric span{font-size:12px;color:#756d67}.notice{background:#fff;border:1px solid #e8dfd5;border-radius:18px;padding:18px;line-height:1.7;font-size:14px;color:#625955}
  </style>
</head>
<body>
  <main id="login" class="shell"><section class="card"><div class="hero"><div class="tag">RESTAURANT OPERATIONS</div><h1>餐飲 SOP<br>與成本管理</h1><p>手機管理入口</p></div><form id="form" class="form"><label>E-mail<input id="email" type="email" autocomplete="email" required></label><label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" minlength="4" maxlength="12" required></label><p id="error" class="error"></p><button id="submit">登入</button></form></section></main>
  <main id="dashboard" class="dash hidden"><header><button class="logout" id="logout">登出</button><div class="tag" style="color:#8b641d">RESTAURANT OPERATIONS</div><h1>餐飲 SOP 與成本管理</h1></header><section class="content"><div class="welcome"><p id="hello">您好，夥伴</p><h2>今天要處理什麼？</h2></div><div class="grid"><div class="metric"><strong id="sopCount">0</strong><span>SOP</span></div><div class="metric"><strong id="productCount">0</strong><span>品項</span></div><div class="metric"><strong id="recipeCount">0</strong><span>食譜</span></div></div><div class="notice"><b>行動版已連線</b><br>此頁面不會把系統密鑰放在手機或網站檔案中。</div></section></main>
  <iframe name="gas-bridge" id="gas-bridge" hidden title="資料服務"></iframe>
  <script>
    const GAS_URL='https://script.google.com/macros/s/AKfycbyT8vTMK4gkeGilhOiPCiwjnUgBHdp08IXiwAk2u6ZRi6lQ7psJvgcX4IFXsEBXnMZs/exec';
    const pending=new Map();
    window.addEventListener('message',event=>{const d=event.data;if(!d||d.__restaurantSopBridge!==true||!pending.has(d.nonce))return;const job=pending.get(d.nonce);pending.delete(d.nonce);d.ok?job.resolve(d.data):job.reject(new Error(d.error||'服務暫時無法使用'));});
    function api(action,payload){return new Promise((resolve,reject)=>{const nonce=crypto.randomUUID();const timer=setTimeout(()=>{pending.delete(nonce);reject(new Error('服務連線逾時，請再試一次。'));},20000);pending.set(nonce,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});const form=document.createElement('form');form.method='post';form.action=GAS_URL;form.target='gas-bridge';const input=document.createElement('input');input.type='hidden';input.name='request';input.value=JSON.stringify({bridge:true,nonce,action,payload});form.append(input);document.body.append(form);form.submit();form.remove();});}
    const $=id=>document.getElementById(id);
    $('form').addEventListener('submit',async e=>{e.preventDefault();$('error').style.display='none';$('submit').disabled=true;$('submit').textContent='登入中…';try{const session=await api('login',{email:$('email').value,pin:$('pin').value});const data=await api('getAppData',{token:session.token});const user=session.user||data.user||{};$('hello').textContent='您好，'+(user.Name||user.name||'夥伴');$('sopCount').textContent=(data.sops||[]).length;$('productCount').textContent=(data.products||[]).length;$('recipeCount').textContent=(data.recipes||[]).length;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}catch(err){$('error').textContent=err.message;$('error').style.display='block'}finally{$('submit').disabled=false;$('submit').textContent='登入'}});$('logout').onclick=()=>location.reload();
  </script>
</body>
</html>
